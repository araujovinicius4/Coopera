services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coopera
      MYSQL_USER: coopera
      MYSQL_PASSWORD: coopera
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["coopera_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  coopera_mysql:
